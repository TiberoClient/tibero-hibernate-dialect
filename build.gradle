plugins {
    id 'java'
}

group = 'com.tmax.tibero'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

// 소스 폴더 구조 설정 (현재 구조에 맞게)
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        // META-INF/services 를 jar 에 넣기 위해 필요하다. 이 선언이 없으면 Gradle 기본값
        // src/main/resources 를 보는데 그 디렉터리가 없어서 서비스 파일이 통째로 빠지고,
        // DialectResolver 자동 인식이 클래스만 남은 채 조용히 죽는다.
        //
        // srcDirs 를 '.' 로 두면 안 된다 — 저장소 루트의
        // META-INF/services/org.jboss.logging.LoggerProvider 는 hibernate-testing 전용이라
        // 배포 jar 에 섞이면 운영 로깅이 깨진다.
        resources {
            srcDirs = ['resources']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test/resources']
        }
    }
}

tasks.test {
    exclude '**/AbstractTiberoDialectTestBase.class'
}

dependencies {
    // Hibernate
    implementation 'org.hibernate.orm:hibernate-core:6.6.56.Final'

    // Tibero JDBC 드라이버 (로컬 JAR) - 아래에 Tibero JDBC JAR 파일의 절대 경로를 입력하세요.
    implementation files('Tibero_JDBC_JAR_절대경로')

    // 테스트
    testImplementation 'org.hibernate.orm:hibernate-testing:6.6.56.Final'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
